name: Work item
description: One change, sized to one pull request into the default branch, alone or as a layer of a stack.
type: Task
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        A new issue is in intake until its criteria are confirmed. Set the type to Bug or Feature
        where that is what it is. Blocked-by and parent relationships are recorded on the issue,
        not in the text.
  - type: textarea
    id: change
    attributes:
      label: What changes
      description: The change, in a few sentences, and what it is for.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        A checklist naming the check that proves each item. Behaviour, not structure: "it builds"
        proves little. Written or confirmed by the owner, not the agent.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Risks, what is out of scope, and where the change touches an executable surface.
